<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Zeichensatz und Viewport-Einstellungen für optimale Handydarstellung (verhindert unabsichtliches Zoomen) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Christmas Wordle</title>
    <!-- Verknüpfung zur externen CSS-Design-Datei -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts Schriftart einbinden -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Hauptcontainer, der das gesamte Spiel zentriert und strukturiert -->
    <main class="game-container">
        
        <!-- Kopfbereich mit dem Haupttitel (Untertitel wurde entfernt) -->
        <header>
            <h1>🎄 Christmas Wordle 🎄</h1>
        </header>

        <!-- Container für Nachrichten (z.B. Sieg-Nachricht). Muss im HTML leer bleiben (auch ohne Leerzeichen), sonst greift das automatische Ausblenden (:empty) in style.css nicht -->
        <div id="message-container"></div>

        <!-- Das Spielfeld für die Rateversuche: 6 Zeilen + 1 versteckte Bonuszeile, je 5 Kacheln (wird via JavaScript befüllt) -->
        <div id="board"></div>

        <!-- Bonus-Dialog: öffnet sich nach dem 6. Fehlversuch. Alle Texte kommen aus BONUS in config.js.
             Beide Dialoge stehen bewusst NICHT im #keyboard-Bereich, sonst würden die Buttons als Tasten behandelt -->
        <dialog id="bonus-dialog" class="game-dialog">
            <!-- Text im Dialog -->
            <p id="bonus-text"></p>
            <!-- Die beiden Buttons nebeneinander (beide tun dasselbe) -->
            <div class="dialog-buttons">
                <button id="bonus-button-1"></button>
                <button id="bonus-button-2"></button>
            </div>
        </dialog>

        <!-- Begrüßungs-Dialog: öffnet sich beim Start, wenn der Tag in config.js ein "intro" hat
             und noch kein Versuch gemacht wurde. Gleiches Aussehen wie der Bonus-Dialog (Klasse game-dialog) -->
        <dialog id="intro-dialog" class="game-dialog">
            <!-- Text im Dialog -->
            <p id="intro-text"></p>
            <!-- Ein Button, der den Dialog schließt -->
            <div class="dialog-buttons">
                <button id="intro-button"></button>
            </div>
        </dialog>

        <!-- Virtuelle Bildschirmtastatur für die komfortable Bedienung auf dem Handy -->
        <div id="keyboard">
            <!-- Erste Tastenreihe (Q bis P) -->
            <div class="keyboard-row">
                <button data-key="Q">Q</button>
                <button data-key="W">W</button>
                <button data-key="E">E</button>
                <button data-key="R">R</button>
                <button data-key="T">T</button>
                <button data-key="Y">Y</button>
                <button data-key="U">U</button>
                <button data-key="I">I</button>
                <button data-key="O">O</button>
                <button data-key="P">P</button>
            </div>
            <!-- Zweite Tastenreihe (A bis L) -->
            <div class="keyboard-row">
                <button data-key="A">A</button>
                <button data-key="S">S</button>
                <button data-key="D">D</button>
                <button data-key="F">F</button>
                <button data-key="G">G</button>
                <button data-key="H">H</button>
                <button data-key="J">J</button>
                <button data-key="K">K</button>
                <button data-key="L">L</button>
            </div>
            <!-- Dritte Tastenreihe mit ENTER, Buchstaben Z-M und Backspace (⌫) -->
            <div class="keyboard-row">
                <button data-key="ENTER" class="wide-key">ENTER</button>
                <button data-key="Z">Z</button>
                <button data-key="X">X</button>
                <button data-key="C">C</button>
                <button data-key="V">V</button>
                <button data-key="B">B</button>
                <button data-key="N">N</button>
                <button data-key="M">M</button>
                <button data-key="BACKSPACE" class="wide-key">⌫</button>
            </div>
        </div>
    </main>

    <!-- Wortliste für die Wortprüfung (alle erlaubten Wörter mit 5 Buchstaben) -->
    <script src="words.js"></script>
    <!-- Verknüpfung zur Konfigurationsdatei -->
    <script src="config.js"></script>
    <!-- Verknüpfung zur JavaScript-Logikdatei -->
    <script src="script.js"></script>
</body>
</html>
