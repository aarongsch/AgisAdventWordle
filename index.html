<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Wordle</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Polaroid Hintergrund-Bilder (Platzhalter) -->
    <div class="polaroid-container">
        <div class="polaroid p1">
            <img src="https://placehold.co/200x200/eee/333?text=Foto+1" alt="Erinnerung 1">
            <p>Wir zwei ❤️</p>
        </div>
        <div class="polaroid p2">
            <img src="https://placehold.co/200x200/eee/333?text=Foto+2" alt="Erinnerung 2">
            <p>Winter-Spaziergang</p>
        </div>
        <div class="polaroid p3">
            <img src="https://placehold.co/200x200/eee/333?text=Foto+3" alt="Erinnerung 3">
            <p>Urlaub ✨</p>
        </div>
        <div class="polaroid p4">
            <img src="https://placehold.co/200x200/eee/333?text=Foto+4" alt="Erinnerung 4">
            <p>Lieblingsmensch</p>
        </div>
    </div>

    <!-- Hauptbereich des Spiels -->
    <main class="game-container">
        <header>
            <h1>🎄 Advent Wordle 🎄</h1>
            <p id="day-subtitle">Türchen #1</p>
        </header>

        <!-- Nachrichtensystem (Gewonnen / Verloren / Zu kurz) -->
        <div id="message-container" class="hidden"></div>

        <!-- 6x5 Spielfeld -->
        <div id="board"></div>

        <!-- Bildschirmtastatur -->
        <div id="keyboard">
            <div class="keyboard-row">
                <button data-key="Q">Q</button>
                <button data-key="W">W</button>
                <button data-key="E">E</button>
                <button data-key="R">R</button>
                <button data-key="T">T</button>
                <button data-key="Y">Y</button>
                <button data-key="U">U</button>
                <button data-key="I">I</button>
                <button data-key="O">O</button>
                <button data-key="P">P</button>
            </div>
            <div class="keyboard-row">
                <button data-key="A">A</button>
                <button data-key="S">S</button>
                <button data-key="D">D</button>
                <button data-key="F">F</button>
                <button data-key="G">G</button>
                <button data-key="H">H</button>
                <button data-key="J">J</button>
                <button data-key="K">K</button>
                <button data-key="L">L</button>
            </div>
            <div class="keyboard-row">
                <button data-key="ENTER" class="wide-key">ENTER</button>
                <button data-key="Z">Z</button>
                <button data-key="X">X</button>
                <button data-key="C">C</button>
                <button data-key="V">V</button>
                <button data-key="B">B</button>
                <button data-key="N">N</button>
                <button data-key="M">M</button>
                <button data-key="BACKSPACE" class="wide-key">⌫</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
